name: test

on:
  push:
    branches: [main]
  pull_request:
  # the kit workflow asks for a run on a commit it pushed (a push with a workflow's token starts none)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the built kit matches src/, dockit's checks, the page builder, the imported skills' tests (no browser, no d2)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # figure-check's regression tests (a real browser and the pinned d2), and vlmkit's page gates on the example deck
  figures:
    # Playwright 1.56 has no browser for the newest Ubuntu image: stay on the one it supports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the fixtures have Japanese labels: without a CJK font every one of them is a missing glyph
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: pnpm exec playwright install --with-deps chromium
      - run: sh scripts/setup-d2.sh
      - run: pnpm test:figures
